<div class="card-title" style="color: var(--danger);">➖ Withdrawals & Capital Reductions</div>
                        </div>
                        <ul id="withdrawalHistoryList" class="list-unstyled">
                            <li style="color: var(--text-muted);">No withdrawals recorded yet</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- TAB 4: RECYCLE BIN -->
            <div id="recycleTab" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title"><span>🗑️</span> Recycle Bin</div>
                            <div class="card-subtitle">Deleted trades can be restored or permanently removed here</div>
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="emptyRecycleBin()">Empty Recycle Bin</button>
                  </div>
                  <div class="table-responsive">
                      <table id="recycleTable">
                          <thead>
                              <tr>
                                  <th>Date</th>
                                  <th>Index / Option</th>
                                  <th>Strike Price</th>
                                  <th>Net P&L</th>
                                  <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rendered dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

          <!-- TAB 5: SETTINGS -->
          <div id="settingsTab" class="tab-content">
              <div class="card" style="max-width: 600px;">
                  <div class="card-header">
                      <div class="card-title"><span>⚙️</span> Account Settings</div>
                  </div>
                  <div class="form-group" style="margin-bottom: 14px;">
                      <label>Trader Name</label>
                      <input type="text" id="settingTraderName" class="form-control" value="Anurag Patel">
                  </div>
                  <div class="form-group" style="margin-bottom: 14px;">
                      <label>Initial Capital Balance (₹)</label>
                      <input type="number" id="settingInitialCapital" class="form-control" value="50000">
                  </div>
                  <div class="form-group" style="margin-bottom: 14px;">
                      <label>Daily Loss Limit Alert (₹)</label>
                      <input type="number" id="settingDailyLossLimit" class="form-control" value="3000">
                  </div>
                  <button class="btn btn-primary" onclick="saveSettings()">Save Changes</button>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Default App Settings & State
        let appSettings = {
            traderName: "Anurag Patel",
            initialCapital: 50000,
            dailyLossLimit: 3000
        };

        let currentCapital = 50000;
        let trades = [];
        let recycleBin = [];
        let deposits = [];
        let withdrawals = [];
        let equityChartInstance = null;

        // Lot configuration mapping
        const lotSizes = {
            "Nifty": 65,
            "Sensex": 20,
            "BankNifty": 30,
            "FinNifty": 60
        };

        // Set default date to today
        document.getElementById('tradeDate').valueAsDate = new Date();

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            if ((user === "Anurag" || user === "") && (pass === "12345" || pass === "")) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                initChart();
                updateDashboard();
            } else {
                alert("Invalid User ID or Password. Default is Anurag / 12345");
            }
        }

        function forgotPassword() {
            alert("Hint: Use User ID 'Anurag' and Password '12345'");
        }

        function handleLogout() {
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            if (element) element.classList.add('active');

            if (tabId === 'dashboardTab' && equityChartInstance) {
                equityChartInstance.resize();
            }
        }

        function onIndexChange() {
            const index = document.getElementById('indexName').value;
            document.getElementById('qtyPerLot').value = lotSizes[index] || 65;
        }

        function processDeposit() {
            const amount = parseFloat(document.getElementById('depositAmountInput').value);
            const note = document.getElementById('depositNoteInput').value.trim() || "Deposit";
            if (!amount || amount <= 0) {
                alert("Please enter a valid deposit amount.");
                return;
            }

            currentCapital += amount;
            deposits.push({ date: new Date().toLocaleDateString(), amount, note });
            
            document.getElementById('depositAmountInput').value = '';
            document.getElementById('depositNoteInput').value = '';
            updateDashboard();
            renderDepositHistory();
            alert("Deposit successful!");
        }

        function processWithdrawal() {
            const amount = parseFloat(document.getElementById('withdrawAmountInput').value);
            const note = document.getElementById('withdrawNoteInput').value.trim() || "Withdrawal";
            if (!amount || amount <= 0) {
                alert("Please enter a valid withdrawal amount.");
                return;
            }
            if (amount > currentCapital) {
                alert("Insufficient capital balance for this withdrawal.");
                return;
            }

            currentCapital -= amount;
            withdrawals.push({ date: new Date().toLocaleDateString(), amount, note });

            document.getElementById('withdrawAmountInput').value = '';
            document.getElementById('withdrawNoteInput').value = '';
            updateDashboard();
            renderWithdrawalHistory();
            alert("Withdrawal successful!");
        }

        function saveTrade() {
            const date = document.getElementById('tradeDate').value;
            const index = document.getElementById('indexName').value;
            const cePe = document.getElementById('cePe').value;
            const strikePrice = document.getElementById('strikePrice').value;
            const lots = parseInt(document.getElementById('lots').value) || 1;
            const qtyPerLot = parseInt(document.getElementById('qtyPerLot').value) || 65;
            const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
            const sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
            const targetPrice = parseFloat(document.getElementById('targetPrice').value) || 0;
            const stopLossPrice = parseFloat(document.getElementById('stopLossPrice').value) || 0;
            const setup = document.getElementById('tradeSetup').value.trim();
            const mindset = document.getElementById('traderMindset').value;

            if (!date || !buyPrice || !sellPrice) {
                alert("Please fill in Date, Buy Price, and Sell Price.");
                return;
            }

            const totalQty = lots * qtyPerLot;
            const grossPnL = (sellPrice - buyPrice) * totalQty;
            // Estimated brokerage & charges (approx 0.03% or flat standard assumptions)
            const charges = Math.round((buyPrice + sellPrice) * totalQty * 0.0003 * 100) / 100;
            const netPnL = grossPnL - charges;

            // Calculate Risk Reward Ratio (RRR) if target and stop loss are provided
            let rrr = "-";
            if (targetPrice > 0 && stopLossPrice > 0 && buyPrice > stopLossPrice) {
                const risk = buyPrice - stopLossPrice;
                const reward = targetPrice - buyPrice;
                rrr = (reward / risk).toFixed(2) + " : 1";
            }

            const newTrade = {
                id: Date.now(),
                date, index, cePe, strikePrice, lots, totalQty,
                buyPrice, sellPrice, targetPrice, stopLossPrice,
                setup, mindset, charges, netPnL, rrr
            };

            trades.push(newTrade);
            currentCapital += netPnL;

            // Reset form fields
            document.getElementById('buyPrice').value = '';
            document.getElementById('sellPrice').value = '';
            document.getElementById('targetPrice').value = '';
            document.getElementById('stopLossPrice').value = '';
            document.getElementById('tradeSetup').value = '';

            updateDashboard();
            renderTradeTable();
            alert("Trade saved successfully!");
        }

        function deleteTrade(id) {
            const index = trades.findIndex(t => t.id === id);
            if (index !== -1) {
                const removed = trades.splice(index, 1)[0];
                currentCapital -= removed.netPnL; // Revert PnL impact
                recycleBin.push(removed);
                updateDashboard();
                renderTradeTable();
                renderRecycleBin();
            }
        }

        function restoreTrade(id) {
            const index = recycleBin.findIndex(t => t.id === id);
            if (index !== -1) {
                const restored = recycleBin.splice(index, 1)[0];
                trades.push(restored);
                currentCapital += restored.netPnL;
                updateDashboard();
                renderTradeTable();
                renderRecycleBin();
            }
        }

        function permanentlyDelete(id) {
            recycleBin = recycleBin.filter(t => t.id !== id);
            renderRecycleBin();
        }

        function emptyRecycleBin() {
            recycleBin = [];
            renderRecycleBin();
        }

        function clearHistory() {
            if (confirm("Are you sure you want to clear all active trades?")) {
                trades.forEach(t => currentCapital -= t.netPnL);
                recycleBin.push(...trades);
                trades = [];
                updateDashboard();
                renderTradeTable();
                renderRecycleBin();
            }
        }

        function saveSettings() {
            appSettings.traderName = document.getElementById('settingTraderName').value.trim() || "Anurag Patel";
            appSettings.initialCapital = parseFloat(document.getElementById('settingInitialCapital').value) || 50000;
            appSettings.dailyLossLimit = parseFloat(document.getElementById('settingDailyLossLimit').value) || 3000;

            document.getElementById('sidebarUserName').innerText = appSettings.traderName;
            alert("Settings updated successfully!");
            updateDashboard();
        }

        function updateDashboard() {
            // Update capital card & metrics
            document.getElementById('cardCurrentCapital').innerText = '₹' + currentCapital.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            let totalPnL = trades.reduce((sum, t) => sum + t.netPnL, 0);
            const pnlElem = document.getElementById('cardTotalPnL');
            pnlElem.innerText = '₹' + totalPnL.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            pnlElem.className = "value " + (totalPnL >= 0 ? "profit" : "loss");

            // Win rate calculations
            const totalTradesCount = trades.length;
            const wins = trades.filter(t => t.netPnL > 0).length;
            const losses = trades.filter(t => t.netPnL <= 0).length;
            const winRate = totalTradesCount > 0 ? ((wins / totalTradesCount) * 100).toFixed(1) : 0;

            document.getElementById('cardWinRate').innerText = winRate + '%';
            document.getElementById('cardWinLossCount').innerText = `${wins} / ${losses}`;

            // Monthly / Yearly aggregations
            const now = new Date();
            const currentMonthStr = now.toISOString().slice(0, 7); // YYYY-MM
            const currentYearStr = now.getFullYear().toString();

            const monthlyPnL = trades.filter(t => t.date.startsWith(currentMonthStr)).reduce((sum, t) => sum + t.netPnL, 0);
            const yearlyPnL = trades.filter(t => t.date.startsWith(currentYearStr)).reduce((sum, t) => sum + t.netPnL, 0);

            const mElem = document.getElementById('cardMonthlyPnL');
            mElem.innerText = '₹' + monthlyPnL.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            mElem.className = "value " + (monthlyPnL >= 0 ? "profit" : "loss");

            const yElem = document.getElementById('cardYearlyPnL');
            yElem.innerText = '₹' + yearlyPnL.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            yElem.className = "value " + (yearlyPnL >= 0 ? "profit" : "loss");

            // Loss limit check alert
            const todayStr = now.toISOString().slice(0, 10);
            const todayPnL = trades.filter(t => t.date === todayStr).reduce((sum, t) => sum + t.netPnL, 0);
            const alertBox = document.getElementById('alertBox');
            if (todayPnL <= -appSettings.dailyLossLimit) {
                alertBox.style.display = 'block';
            } else {
                alertBox.style.display = 'none';
            }

            document.getElementById('recycleCountBadge').innerText = recycleBin.length;

            renderBreakdowns();
            updateChart();
        }

        function renderTradeTable() {
            const tbody = document.querySelector('#tradeTable tbody');
            tbody.innerHTML = '';

            if (trades.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--text-muted);">No trades logged yet</td></tr>`;
                return;
            }

            trades.forEach(t => {
                const badgeClass = t.cePe.includes("CALL") ? "badge-ce" : "badge-pe";
                const pnlClass = t.netPnL >= 0 ? "profit" : "loss";
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${t.date}</td>
                    <td><span class="badge-tag ${badgeClass}">${t.index} ${t.cePe.split(" ")[0]}</span></td>
                    <td>₹${t.strikePrice}</td>
                    <td>${t.setup || '-'}</td>
                    <td>₹${t.buyPrice} / ₹${t.sellPrice}</td>
                    <td>${t.totalQty} (${t.lots}L)</td>
                    <td>${t.rrr}</td>
                    <td>₹${t.charges}</td>
                    <td class="${pnlClass}"><strong>₹${t.netPnL.toFixed(2)}</strong></td>
                    <td>${t.mindset}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteTrade(${t.id})">Delete</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderRecycleBin() {
            const tbody = document.querySelector('#recycleTable tbody');
            tbody.innerHTML = '';

            if (recycleBin.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Recycle bin is empty</td></tr>`;
                return;
            }

            recycleBin.forEach(t => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${t.date}</td>
                    <td>${t.index} ${t.cePe}</td>
                    <td>₹${t.strikePrice}</td>
                    <td class="${t.netPnL >= 0 ? 'profit' : 'loss'}">₹${t.netPnL.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-success btn-sm" onclick="restoreTrade(${t.id})">Restore</button>
                        <button class="btn btn-danger btn-sm" onclick="permanentlyDelete(${t.id})">Remove</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderDepositHistory() {
            const list = document.getElementById('depositHistoryList');
            if (deposits.length === 0) {
                list.innerHTML = `<li style="color: var(--text-muted);">No deposits recorded yet</li>`;
                return;
            }
            list.innerHTML = deposits.map(d => `<li><span>${d.date} - ${d.note}</span><strong class="profit">+₹${d.amount.toLocaleString()}</strong></li>`).join('');
        }

        function renderWithdrawalHistory() {
            const list = document.getElementById('withdrawalHistoryList');
            if (withdrawals.length === 0) {
                list.innerHTML = `<li style="color: var(--text-muted);">No withdrawals recorded yet</li>`;
                return;
            }
            list.innerHTML = withdrawals.map(w => `<li><span>${w.date} - ${w.note}</span><strong class="loss">-₹${w.amount.toLocaleString()}</strong></li>`).join('');
        }

        function renderBreakdowns() {
            const monthlyMap = {};
            const yearlyMap = {};

            trades.forEach(t => {
                const mKey = t.date.slice(0, 7);
                const yKey = t.date.slice(0, 4);
                monthlyMap[mKey] = (monthlyMap[mKey] || 0) + t.netPnL;
                yearlyMap[yKey] = (yearlyMap[yKey] || 0) + t.netPnL;
            });

            const mList = document.getElementById('autoMonthlyList');
            const yList = document.getElementById('autoYearlyList');

            if (Object.keys(monthlyMap).length === 0) {
                mList.innerHTML = `<li style="color: var(--text-muted);">No trades recorded yet</li>`;
            } else {
                mList.innerHTML = Object.entries(monthlyMap).map(([m, pnl]) => `<li><span>${m}</span><strong class="${pnl >= 0 ? 'profit' : 'loss'}">₹${pnl.toFixed(2)}</strong></li>`).join('');
            }

            if (Object.keys(yearlyMap).length === 0) {
                yList.innerHTML = `<li style="color: var(--text-muted);">No trades recorded yet</li>`;
            } else {
                yList.innerHTML = Object.entries(yearlyMap).map(([y, pnl]) => `<li><span>${y}</span><strong class="${pnl >= 0 ? 'profit' : 'loss'}">₹${pnl.toFixed(2)}</strong></li>`).join('');
            }
        }

        function initChart() {
            const ctx = document.getElementById('equityChart').getContext('2d');
            equityChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Start'],
                    datasets: [{
                        label: 'Equity Curve',
                        data: [appSettings.initialCapital],
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                        y: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } }
                    }
                }
            });
        }

        function updateChart() {
            if (!equityChartInstance) return;

            let runningBal = appSettings.initialCapital;
            const labels = ['Start'];
            const dataPoints = [runningBal];

            trades.forEach((t, idx) => {
                runningBal += t.netPnL;
                labels.push(`Trade ${idx + 1}`);
                dataPoints.push(runningBal);
            });

            equityChartInstance.data.labels = labels;
            equityChartInstance.data.datasets[0].data = dataPoints;
            equityChartInstance.update();
        }

        function exportToExcel() {
            if (trades.length === 0) {
                alert("No trades to export.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Date,Index,Option,Strike,Lots,Qty,BuyPrice,SellPrice,Charges,NetPnL,Mindset\n";
            trades.forEach(t => {
                csvContent += `${t.date},${t.index},${t.cePe},${t.strikePrice},${t.lots},${t.totalQty},${t.buyPrice},${t.sellPrice},${t.charges},${t.netPnL},${t.mindset}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "TradeTracker_Log.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
